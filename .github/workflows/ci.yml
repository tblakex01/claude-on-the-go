name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Cancel in-progress runs when new commit pushed to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automated_test:  # This name matches the required status check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio mypy black isort
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        timeout-minutes: 5
        run: |
          if [ -d "tests" ] || [ -d "legacy/tests" ]; then
            if pytest -q --co -q &> /dev/null; then
              pytest --tb=short --strict-markers
            else
              echo "⚠️  No tests found, skipping"
            fi
          else
            echo "⚠️  No tests directory, skipping"
          fi

      - name: Type checking
        timeout-minutes: 3
        run: |
          if ls core/*.py server/*.py integrations/*.py 2>/dev/null; then
            mypy core/ server/ integrations/
          else
            echo "⚠️  No Python files to check"
          fi

      - name: Code formatting check
        timeout-minutes: 2
        run: |
          black --check --line-length 100 .
          isort --check .

      - name: Summary
        if: always()
        run: |
          echo "✅ CI checks completed!"
          echo "📝 Note: Some checks are non-blocking during initial setup"
