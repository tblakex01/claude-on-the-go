name: Dependency Review

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    # Non-blocking until Dependency graph is enabled in repo settings
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail on high or critical vulnerabilities
          fail-on-severity: high
          # Comment on PR with results
          comment-summary-in-pr: always
          # Retry on rate limit
          retry-on-snapshot-warnings: true

      - name: Check Python dependencies with pip-audit
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

          echo "### Python Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --desc --format json > audit-results.json || true

            # Parse and display results
            if [ -f audit-results.json ]; then
              VULNERABILITIES=$(cat audit-results.json | python -c "import sys, json; data=json.load(sys.stdin); print(len(data.get('vulnerabilities', [])))" 2>/dev/null || echo "0")

              if [ "$VULNERABILITIES" -gt 0 ]; then
                echo "⚠️  Found $VULNERABILITIES vulnerable dependencies" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "Run \`pip-audit -r requirements.txt\` locally for details" >> $GITHUB_STEP_SUMMARY
              else
                echo "✅ No known vulnerabilities found in Python dependencies" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          else
            echo "No requirements.txt found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Dependency Review Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This check ensures:" >> $GITHUB_STEP_SUMMARY
          echo "- No high/critical severity vulnerabilities in new dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- Compatible open source licenses" >> $GITHUB_STEP_SUMMARY
          echo "- Up-to-date security advisories" >> $GITHUB_STEP_SUMMARY
