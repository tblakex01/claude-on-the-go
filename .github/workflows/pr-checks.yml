name: PR Quality Checks

on:
  pull_request:
    branches: [ main ]

# Cancel in-progress runs when new commit pushed to same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install analysis tools
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit safety radon

      - name: Linting with flake8
        timeout-minutes: 2
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings (non-blocking)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Security check with bandit
        continue-on-error: true
        run: |
          bandit -r core/ server/ integrations/ -f json -o bandit-report.json || echo "⚠️  Security issues found (non-blocking)"
          if [ -f bandit-report.json ]; then
            echo "📋 Security scan completed"
          fi

      - name: Check dependencies for vulnerabilities
        continue-on-error: true
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          safety check --json || echo "⚠️  Dependency vulnerabilities found (non-blocking)"

      - name: Code complexity check
        continue-on-error: true
        run: |
          radon cc core/ server/ integrations/ -a -nb || echo "⚠️  High complexity code detected"
          radon mi core/ server/ integrations/ -nb || echo "⚠️  Low maintainability detected"

      - name: Summary
        if: always()
        run: |
          echo "✅ Quality checks completed!"
          echo "📝 Review warnings above to improve code quality"

  pr-size-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          LINES_CHANGED=$(git diff --shortstat origin/main...HEAD | awk '{print $4+$6}')
          echo "📊 Lines changed: $LINES_CHANGED"

          if [ "$LINES_CHANGED" -gt 1000 ]; then
            echo "⚠️  WARNING: PR is quite large ($LINES_CHANGED lines)"
            echo "Consider breaking into smaller PRs for easier review"
          else
            echo "✅ PR size is reasonable"
          fi

  commit-message-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          echo "📝 Checking commit message format..."

          # Get all commits in this PR
          COMMITS=$(git log --pretty=format:"%s" origin/main..HEAD)

          # Check conventional commit format
          echo "$COMMITS" | while read -r msg; do
            if echo "$msg" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|chore)(\(.+\))?: .+"; then
              echo "✅ $msg"
            else
              echo "⚠️  Not conventional format: $msg"
            fi
          done
