name: Weekly Security Scan

on:
  # Run every Sunday at 3 AM UTC
  schedule:
    - cron: '0 3 * * 0'
  # Allow manual trigger
  workflow_dispatch:
  # Also run on changes to security-related files
  push:
    branches: [ main ]
    paths:
      - 'requirements.txt'
      - '.github/workflows/security-scan.yml'

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies and security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit semgrep
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Bandit security linter
        continue-on-error: true
        run: |
          echo "### Bandit Security Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run bandit on all Python code
          bandit -r core/ server/ integrations/ legacy/ \
            -f json -o bandit-report.json \
            -ll -i || true

          # Parse and display results
          if [ -f bandit-report.json ]; then
            HIGH_SEVERITY=$(cat bandit-report.json | python -c "import sys, json; data=json.load(sys.stdin); print(len([x for x in data.get('results', []) if x['issue_severity'] == 'HIGH']))" 2>/dev/null || echo "0")
            MEDIUM_SEVERITY=$(cat bandit-report.json | python -c "import sys, json; data=json.load(sys.stdin); print(len([x for x in data.get('results', []) if x['issue_severity'] == 'MEDIUM']))" 2>/dev/null || echo "0")

            echo "- High severity issues: $HIGH_SEVERITY" >> $GITHUB_STEP_SUMMARY
            echo "- Medium severity issues: $MEDIUM_SEVERITY" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Save for artifact upload
            echo "$HIGH_SEVERITY" > high-severity-count.txt
            echo "BANDIT_HIGH=$HIGH_SEVERITY" >> $GITHUB_ENV
            echo "BANDIT_MEDIUM=$MEDIUM_SEVERITY" >> $GITHUB_ENV
          fi

      - name: Run Safety dependency check
        continue-on-error: true
        run: |
          echo "### Safety Dependency Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f requirements.txt ]; then
            safety check --json --output safety-report.json || true

            if [ -f safety-report.json ]; then
              VULNERABILITIES=$(cat safety-report.json | python -c "import sys, json; data=json.load(sys.stdin); print(len(data.get('vulnerabilities', [])))" 2>/dev/null || echo "0")
              echo "- Vulnerable dependencies: $VULNERABILITIES" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "SAFETY_VULNS=$VULNERABILITIES" >> $GITHUB_ENV
            fi
          else
            echo "No requirements.txt found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run pip-audit
        continue-on-error: true
        run: |
          echo "### pip-audit Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --desc --format json > pip-audit-report.json || true

            if [ -f pip-audit-report.json ]; then
              AUDIT_VULNS=$(cat pip-audit-report.json | python -c "import sys, json; data=json.load(sys.stdin); print(len(data.get('vulnerabilities', [])))" 2>/dev/null || echo "0")
              echo "- Vulnerabilities found: $AUDIT_VULNS" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "AUDIT_VULNS=$AUDIT_VULNS" >> $GITHUB_ENV
            fi
          fi

      - name: Run Semgrep security rules
        continue-on-error: true
        run: |
          echo "### Semgrep Security Rules" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run semgrep with security rulesets
          semgrep --config=auto \
            --json --output semgrep-report.json \
            core/ server/ integrations/ legacy/ || true

          if [ -f semgrep-report.json ]; then
            SEMGREP_FINDINGS=$(cat semgrep-report.json | python -c "import sys, json; data=json.load(sys.stdin); print(len(data.get('results', [])))" 2>/dev/null || echo "0")
            echo "- Security findings: $SEMGREP_FINDINGS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "SEMGREP_FINDINGS=$SEMGREP_FINDINGS" >> $GITHUB_ENV
          fi

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.json
            semgrep-report.json
          retention-days: 90

      - name: Create issue for critical findings
        if: env.BANDIT_HIGH != '0' || env.SAFETY_VULNS != '0' || env.AUDIT_VULNS != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const banditHigh = process.env.BANDIT_HIGH || '0';
            const safetyVulns = process.env.SAFETY_VULNS || '0';
            const auditVulns = process.env.AUDIT_VULNS || '0';
            const semgrepFindings = process.env.SEMGREP_FINDINGS || '0';

            const title = `Security Scan Alert: Critical Issues Found (${new Date().toISOString().split('T')[0]})`;
            const body = `## Security Scan Results

            The weekly security scan has detected issues that require attention:

            ### Summary
            - **Bandit (High Severity)**: ${banditHigh} issues
            - **Safety (Vulnerable Dependencies)**: ${safetyVulns} packages
            - **pip-audit (Vulnerabilities)**: ${auditVulns} packages
            - **Semgrep (Security Rules)**: ${semgrepFindings} findings

            ### Next Steps
            1. Download the security reports from the [workflow artifacts](${context.payload.repository.html_url}/actions/runs/${context.runId})
            2. Review each finding and assess severity
            3. Update dependencies or fix code issues
            4. Re-run the security scan to verify fixes

            ### Resources
            - [Bandit Documentation](https://bandit.readthedocs.io/)
            - [Safety Database](https://pyup.io/safety/)
            - [pip-audit Guide](https://github.com/pypa/pip-audit)
            - [Semgrep Rules](https://semgrep.dev/explore)

            ---
            *This issue was automatically created by the weekly security scan workflow.*
            `;

            // Check if similar issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated',
              per_page: 10
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.startsWith('Security Scan Alert:')
            );

            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `### Update: ${new Date().toISOString().split('T')[0]}\n\n${body}`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'automated', 'high-priority']
              });
            }

      - name: Final summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security reports have been uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${BANDIT_HIGH:-0}" != "0" ] || [ "${SAFETY_VULNS:-0}" != "0" ] || [ "${AUDIT_VULNS:-0}" != "0" ]; then
            echo "⚠️  **Action Required**: Critical security issues found!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "A GitHub issue has been created with details." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No critical security issues detected" >> $GITHUB_STEP_SUMMARY
          fi
